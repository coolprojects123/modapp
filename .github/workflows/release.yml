name: Electron Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            build-script: build:linux
          - os: windows-latest
            build-script: build:windows
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      # EVS (castLabs VMP signing) is only needed for Windows; Linux Widevine has no VMP.
      - name: Set up Python for EVS signing
        if: runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install EVS client
        if: runner.os == 'Windows'
        run: python -m pip install --upgrade castlabs-evs

      - name: Install dependencies
        run: npm ci
        env:
          # electron comes from a castLabs GitHub URL; npm 12 blocks git dependencies by default.
          # If npm still refuses it, change root to all.
          NPM_CONFIG_ALLOW_GIT: root

      - name: Test
        run: npm test

      - name: Build Electron packages
        run: npm run ${{ matrix.build-script }}
        env:
          # Used by build/evs-sign.js (afterSign hook); ignored on Linux.
          EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
          EVS_PASSWD: ${{ secrets.EVS_PASSWD }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: electron-${{ matrix.os }}
          path: dist-electron/**
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: dist-electron
          merge-multiple: true

      - name: Publish draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist-electron/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}