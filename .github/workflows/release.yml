name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux packages
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: .apt-cache/archives
          key: ${{ runner.os }}-apt-tauri-${{ hashFiles('.github/workflows/release.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-tauri-

      - name: Install Tauri dependencies
        run: |
          sudo apt-get update
          mkdir -p "$GITHUB_WORKSPACE/.apt-cache/archives/partial"
          sudo apt-get install -y \
            -o Dir::Cache::archives="$GITHUB_WORKSPACE/.apt-cache/archives" \
            build-essential \
            curl \
            file \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            patchelf \
            rpm

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust and Tauri build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: modapp-tauri-release
          cache-on-failure: true

      - name: Build Tauri packages
        run: npm run tauri:build

      - name: Generate release notes
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npm run release:notes

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: modapp ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
          fail_on_unmatched_files: true
          generate_release_notes: false
