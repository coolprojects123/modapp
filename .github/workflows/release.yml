name: Release

# Builds modapp for Linux (.deb + .rpm) and Windows (.msi + .exe)
# and attaches the results to a GitHub Release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: "--bundles deb,rpm"

          - platform: windows-latest
            args: "--bundles msi,nsis"

    runs-on: ${{ matrix.platform }}

    steps:
      # ─────────────────────────────────────────────
      # Checkout
      # ─────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ─────────────────────────────────────────────
      # Linux build dependencies
      # ─────────────────────────────────────────────
      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly

      # ─────────────────────────────────────────────
      # Node.js
      # ─────────────────────────────────────────────
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      # ─────────────────────────────────────────────
      # Rust
      # ─────────────────────────────────────────────
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # ─────────────────────────────────────────────
      # Rust dependency / build cache
      # ─────────────────────────────────────────────
      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # ─────────────────────────────────────────────
      # Frontend dependencies
      # ─────────────────────────────────────────────
      - name: Install frontend dependencies
        run: npm ci

      # ─────────────────────────────────────────────
      # Build + GitHub Release
      # ─────────────────────────────────────────────
      - name: Build and Release
        uses: tauri-apps/tauri-action@v0

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        with:
          # Example:
          # v1.1.0 -> modapp "v1.1.0"
          releaseName: 'modapp "${{ github.ref_name }}"'

          # Release tag
          tagName: ${{ github.ref_name }}

          # Create as draft so you can review it first
          releaseDraft: true

          # Normal release, not prerelease
          prerelease: false

          # Linux: .deb + .rpm
          # Windows: .msi + .exe
          args: ${{ matrix.args }}