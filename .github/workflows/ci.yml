name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    strategy:
      fail-fast: false

      matrix:
        include:
          - platform: ubuntu-22.04

          - platform: windows-latest

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          # Matches release.yml's cache config exactly (same workspaces path,
          # same npm cache) and runs on main, so this is what actually
          # populates a default-branch cache -- the one ref release.yml
          # (triggered by one-off tag pushes) is allowed to restore from.

      - name: Install dependencies
        run: npm install

      - name: Check Rust
        working-directory: ./src-tauri
        run: cargo check